# Daily alerts for the FREE deployment (render.yaml): once a day, call LifeCart's daily job endpoint.
# The app then checks watched prices and bills coming due for every user and sends at most one WhatsApp digest each.
# (The paid deployment, render.paid.yaml, uses a Render cron job + Render Workflows instead.)
#
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#   LIFECART_URL          your app's URL, e.g. https://lifecart.onrender.com (no trailing slash)
#   LIFECART_CRON_SECRET  the APPROVAL_SECRET value from the Render service's Environment tab
# Run it by hand any time: Actions -> Daily alerts -> Run workflow.
name: Daily alerts

on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC = 10:00 US Eastern / 07:00 Pacific
  workflow_dispatch:

permissions: {}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run LifeCart's daily job
        env:
          APP_URL: ${{ secrets.LIFECART_URL }}
          CRON_SECRET: ${{ secrets.LIFECART_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Set the LIFECART_URL and LIFECART_CRON_SECRET repository secrets to enable daily alerts."
            exit 0
          fi
          # Free Render instances sleep when idle: wake the app first (can take about a minute).
          curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 120 -o /dev/null "$APP_URL/"
          curl -fsS --max-time 600 -X POST "$APP_URL/api/cron/daily" -H "Authorization: Bearer $CRON_SECRET"
          echo
