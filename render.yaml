# LifeCart on Render, FREE setup (no card needed). The full paid setup is render.paid.yaml.
#   Dashboard -> New -> Blueprint -> pick this repo (Blueprint path: render.yaml). Render asks for each `sync: false`
#   value once: paste them from your own .env.local; they are never stored in this file.
#
#   lifecart   Next.js web app on a free instance. It sleeps after ~15 min without visits and takes about a minute to
#              wake on the next one. The database schema is applied during each build (npm run db:push).
#
# What the free setup uses instead of paid Render services:
#   Database      Neon free Postgres (neon.tech, no card, doesn't expire). Paste its pooled connection string into
#                 DATABASE_URL. Render's free Postgres expires after 30 days, so it isn't used here.
#   Email         Brevo's HTTPS API for sign-in codes (free, no card). Free instances can't use SMTP (Gmail).
#   Daily alerts  .github/workflows/daily-alerts.yml (GitHub Actions, free) calls POST /api/cron/daily once a day.
#                 Without RENDER_API_KEY the app runs the daily job itself; Render Workflows needs render.paid.yaml.

services:
  - type: web
    name: lifecart
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run db:push && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APPROVAL_SECRET
        generateValue: true
      # Leave APP_URL unset: the app uses RENDER_EXTERNAL_URL. Set it only if you add a custom domain.
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: TWILIO_SANDBOX_JOIN
        sync: false
      # Sign-in emails: Render's free tier blocks SMTP ports, so mail goes out through Brevo's HTTPS API.
      # BREVO_API_KEY from brevo.com -> SMTP & API -> API keys; MAIL_FROM is a sender verified in Brevo -> Senders.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
